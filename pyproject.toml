[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notebook-llm-cli"
version = "0.2.0"
description = "Interactive CLI to run Ollama LLMs on Kaggle/Colab GPUs: GPU detection, fit and tokens/sec estimates, library search, public tunnel."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Shashan Lumbhani", email = "lumbhanishashan1510@gmail.com" }]
keywords = ["ollama", "llm", "kaggle", "colab", "gpu", "cloudflare-tunnel", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://github.com/soni-shashan/notebook-llm"
Issues = "https://github.com/soni-shashan/notebook-llm/issues"

[project.scripts]
notebook-llm = "notebook_llm.cli:main"
notebook_llm = "notebook_llm.cli:main"

[tool.setuptools]
packages = ["notebook_llm"]
